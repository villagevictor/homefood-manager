<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="HomeFood Manager - Digital food business management system">

    <title>HomeFood Manager</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="app">

        <header class="app-header">
            <div>
                <h1>HomeFood Manager</h1>
                <p>Food Business Management System</p>
            </div>
        </header>

        <main class="app-main">

            <section class="welcome-card">
                <h2>Welcome 👋</h2>

                <p>
                    Manage customers, orders, payments,
                    credit and business reports in one place.
                </p>

                <button id="startBtn">
                    Get Started
                </button>
            </section>

        </main>

    </div>

    <script src="js/app.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js")
                    .then(() => {
                        console.log("Service Worker registered");
                    })
                    .catch(error => {
                        console.error(
                            "Service Worker registration failed:",
                            error
                        );
                    });
            });
        }
    </script>

</body>
</html>
