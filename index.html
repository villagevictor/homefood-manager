<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="HomeFood Manager">
<title>HomeFood Manager</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="app">

<header class="topbar">
    <div>
        <div class="brand">HomeFood Manager</div>
        <div class="subtitle">Food Business Management</div>
    </div>

    <button class="icon-btn" onclick="showPage('settings')">⚙</button>
</header>

<div class="layout">

<aside class="sidebar">

    <button onclick="showPage('dashboard')" class="nav-btn active" data-page="dashboard">
        <span>▦</span> Dashboard
    </button>

    <button onclick="showPage('customers')" class="nav-btn" data-page="customers">
        <span>👥</span> Customers
    </button>

    <button onclick="showPage('orders')" class="nav-btn" data-page="orders">
        <span>🛒</span> Orders
    </button>

    <button onclick="showPage('payments')" class="nav-btn" data-page="payments">
        <span>💵</span> Payments
    </button>

    <button onclick="showPage('credit')" class="nav-btn" data-page="credit">
        <span>📒</span> Credit
    </button>

    <button onclick="showPage('menu')" class="nav-btn" data-page="menu">
        <span>🍲</span> Menu
    </button>

    <button onclick="showPage('expenses')" class="nav-btn" data-page="expenses">
        <span>💸</span> Expenses
    </button>

    <button onclick="showPage('reports')" class="nav-btn" data-page="reports">
        <span>📊</span> Reports
    </button>

</aside>

<main id="content"></main>

</div>

<nav class="mobile-nav">

    <button onclick="showPage('dashboard')" data-page="dashboard">▦<small>Home</small></button>
    <button onclick="showPage('customers')" data-page="customers">👥<small>Customers</small></button>
    <button onclick="showPage('orders')" data-page="orders">🛒<small>Orders</small></button>
    <button onclick="showPage('credit')" data-page="credit">📒<small>Credit</small></button>
    <button onclick="showPage('reports')" data-page="reports">📊<small>Reports</small></button>

</nav>

<div id="toast"></div>

</div>

<script src="js/app.js"></script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
    });
}
</script>

</body>
</html>
