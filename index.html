<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="HomeFood Manager - Food Business Management">
<title>HomeFood Manager</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./css/style.css">
</head>

<body>

<div id="app">

<header class="topbar">
    <button class="mobile-menu" onclick="toggleSidebar()">☰</button>

    <div class="brand">
        <div class="brand-icon">🍲</div>
        <div>
            <strong id="brandName">HomeFood Manager</strong>
            <small>Food Business Management</small>
        </div>
    </div>

    <div class="top-actions">
        <button class="icon-btn" onclick="showPage('settings')" title="Settings">⚙️</button>
        <button class="avatar" onclick="showPage('settings')">A</button>
    </div>
</header>

<div class="layout">

<aside id="sidebar" class="sidebar">

    <nav>

        <button class="nav-item active" data-page="dashboard" onclick="showPage('dashboard')">
            <span>▦</span> Dashboard
        </button>

        <button class="nav-item" data-page="customers" onclick="showPage('customers')">
            <span>👥</span> Customers
        </button>

        <button class="nav-item" data-page="orders" onclick="showPage('orders')">
            <span>🛒</span> Orders
        </button>

        <button class="nav-item" data-page="payments" onclick="showPage('payments')">
            <span>💵</span> Payments
        </button>

        <button class="nav-item" data-page="credit" onclick="showPage('credit')">
            <span>📒</span> Credit
        </button>

        <button class="nav-item" data-page="menu" onclick="showPage('menu')">
            <span>🍲</span> Menu
        </button>

        <button class="nav-item" data-page="expenses" onclick="showPage('expenses')">
            <span>💸</span> Expenses
        </button>

        <button class="nav-item" data-page="reports" onclick="showPage('reports')">
            <span>📊</span> Reports
        </button>

        <button class="nav-item" data-page="settings" onclick="showPage('settings')">
            <span>⚙️</span> Settings
        </button>

    </nav>

    <div class="sidebar-footer">
        <small>HomeFood Manager</small>
        <span>Offline ready</span>
    </div>

</aside>

<main id="main" class="main"></main>

</div>

<nav class="mobile-nav">

    <button data-page="dashboard" onclick="showPage('dashboard')">
        <span>▦</span>
        <small>Home</small>
    </button>

    <button data-page="customers" onclick="showPage('customers')">
        <span>👥</span>
        <small>Customers</small>
    </button>

    <button data-page="orders" onclick="showPage('orders')">
        <span>🛒</span>
        <small>Orders</small>
    </button>

    <button data-page="payments" onclick="showPage('payments')">
        <span>💵</span>
        <small>Payment</small>
    </button>

    <button data-page="credit" onclick="showPage('credit')">
        <span>📒</span>
        <small>Credit</small>
    </button>

</nav>

<div id="toast-container"></div>

<div id="modal-container"></div>

</div>

<script src="./js/app.js"></script>

<script>
if("serviceWorker" in navigator){
    window.addEventListener("load",()=>{
        navigator.serviceWorker.register("./sw.js").catch(()=>{});
    });
}
</script>

</body>
</html>
