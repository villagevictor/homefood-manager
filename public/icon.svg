<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.5" />
  
  <!-- Food / Cloche / Bowl Motif -->
  <g filter="url(#shadow)" transform="translate(40, 20)">
    <!-- Steam waves -->
    <path d="M190 120 C180 90 220 70 200 40" stroke="#f97316" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M226 130 C216 95 256 75 236 35" stroke="#f97316" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.95" />
    <path d="M262 120 C252 90 292 70 272 40" stroke="#f97316" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85" />

    <!-- Cloche dome -->
    <circle cx="216" cy="148" r="20" fill="#f97316" />
    <path d="M96 260 C96 175 150 156 216 156 C282 156 336 175 336 260 Z" fill="url(#accentGrad)" />
    
    <!-- Platter / Base plate -->
    <rect x="76" y="260" width="280" height="24" rx="12" fill="#e2e8f0" />
    <rect x="60" y="278" width="312" height="14" rx="7" fill="#cbd5e1" />
    
    <!-- Bowl / Food serving bottom -->
    <path d="M106 292 L126 350 C136 380 166 400 216 400 C266 400 296 380 306 350 L326 292 Z" fill="#ffffff" />
    
    <!-- Cutlery accent: Spoon & Fork crossing subtle -->
    <circle cx="216" cy="346" r="22" fill="#ea580c" />
    <!-- Checkmark or heart in center of bowl badge -->
    <path d="M208 346 L214 352 L226 340" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
